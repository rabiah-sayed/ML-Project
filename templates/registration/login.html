{% extends "base.html" %}
{% block title %}Login - PriceSense{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-row">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<p class="message error">{{ error }}</p>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit">Log in</button>
    </form>
    <p style="margin-top:14px;">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
