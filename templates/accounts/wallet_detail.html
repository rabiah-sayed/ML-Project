{% extends "base.html" %}
{% block title %}Wallet - PriceSense{% endblock %}
{% block content %}
<div class="account-layout">
    {% include "accounts/_account_nav.html" %}
    <div>
        <h2>Wallet</h2>
        <div class="card" style="max-width:420px;">
            <p style="color:var(--text-faint); margin-bottom:2px;">Balance</p>
            <p class="price" style="font-size:1.8rem;">{{ wallet.balance }}</p>
            <form method="post" style="margin-top:18px;">
                {% csrf_token %}
                <div class="form-row">
                    <label for="amount">Add funds (mocked -- just increments balance)</label>
                    <input type="number" step="0.01" min="0" name="amount" id="amount" required>
                </div>
                <button type="submit">Add money</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
